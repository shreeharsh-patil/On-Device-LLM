name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.4.0)'
        required: false
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure No Keystore Files Are Tracked
        run: |
          TRACKED_SECRETS=$(git ls-files '*.keystore' '*.jks' '*.p12' '*.pk8' '*.pem' 'keystore.properties')
          if [ -n "$TRACKED_SECRETS" ]; then
            echo "::error::Tracked private signing files found in Git history/tree:"
            echo "$TRACKED_SECRETS"
            exit 1
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Restore or generate release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          umask 077
          KEYSTORE_FILE="$RUNNER_TEMP/on-device-llm-release.keystore"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Configured GitHub Actions release secrets detected. Restoring production release keystore..."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            test -s "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secrets configured in GitHub Actions. Generating automated standalone release signing key..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "ondevice-release" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android-release-ci" \
              -keypass "android-release-ci" \
              -dname "CN=OnDeviceLLM, OU=Engineering, O=OnDeviceLLM, L=Local, S=State, C=US"
            test -s "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=android-release-ci" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=ondevice-release" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android-release-ci" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signing
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose "$APK"

      - name: Prepare Release Assets
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.4.0"
          fi
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/OnDeviceLLM-${TAG_NAME}.apk
          cd release-artifacts
          sha256sum OnDeviceLLM-${TAG_NAME}.apk > SHA256SUMS.txt

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: on-device-llm-release-apk
          path: release-artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0') }}
          files: |
            release-artifacts/*
          generate_release_notes: true
